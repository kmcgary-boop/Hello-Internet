
<!-- CONTACT -->
<section id="contact" class="section">
    <div class="section-container">
        <div class="contact-card">

            <p class="eyebrow">Say Hello</p>
            <h2>Contact Me</h2>
            <h3>Let's Connect</h3>

            <p>
                Thanks for visiting my portfolio!
                Fill out the form below to contact me.
            </p>

            <form id="contact-form" novalidate>

                <!-- NAME -->
                <div class="form-field">
                    <label for="contact-name">
                        Your Name (required)
                    </label>

                    <input
                        type="text"
                        id="contact-name"
                        name="name"
                        required
                        autocomplete="name"
                        aria-describedby="name-error"
                    >

                    <span id="name-error"
                          class="field-error"
                          aria-live="polite"></span>
                </div>

                <!-- EMAIL -->
                <div class="form-field">
                    <label for="contact-email">
                        Email Address (required)
                    </label>

                    <input
                        type="email"
                        id="contact-email"
                        name="email"
                        required
                        autocomplete="email"
                        aria-describedby="email-error"
                    >

                    <span id="email-error"
                          class="field-error"
                          aria-live="polite"></span>
                </div>

                <!-- REASON FOR CONTACT -->
                <fieldset class="form-field">
                    <legend>
                        Reason for Contacting Me
                    </legend>

                    <label>
                        <input type="radio"
                               name="reason"
                               value="Question"
                               checked>
                        General Question
                    </label>

                    <label>
                        <input type="radio"
                               name="reason"
                               value="Project">
                        Project Inquiry
                    </label>
                </fieldset>

                <!-- MESSAGE -->
                <div class="form-field">
                    <label for="contact-message">
                        Your Message (required)
                    </label>

                    <textarea
                        id="contact-message"
                        name="message"
                        rows="5"
                        required
                        aria-describedby="message-error"
                    ></textarea>

                    <span id="message-error"
                          class="field-error"
                          aria-live="polite"></span>
                </div>

                <button type="submit" class="button">
                    Prepare Email
                </button>

                <p id="form-status" role="status"></p>

            </form>
        </div>
    </div>
</section>
